<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Live Chat</title>
<style>
  :root {
    --bg: #070b14;
    --bg-soft: #0d1322;
    --panel: #121a2e;
    --panel-2: #0b1120;
    --line: rgba(255, 255, 255, 0.08);
    --text: #eef1f7;
    --muted: #8b94ab;
    --accent: #0e75b6;
    --accent-2: #00c9a7;
    --grad: linear-gradient(135deg, #0e75b6, #00c9a7);
    --bubble-in: #1a2440;
    --bubble-mine: linear-gradient(135deg, #0e75b6, #0a5f96);
    --shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    position: relative;
  }

  /* ---------- premium animated aurora background ---------- */
  .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .aurora .blob {
    position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.5;
    will-change: transform;
  }
  .aurora .b1 {
    width: 560px; height: 560px; left: -140px; top: -160px;
    background: radial-gradient(circle at 40% 40%, #0e75b6, transparent 70%);
    animation: drift1 22s ease-in-out infinite alternate;
  }
  .aurora .b2 {
    width: 520px; height: 520px; right: -160px; bottom: -180px;
    background: radial-gradient(circle at 60% 60%, #00c9a7, transparent 70%);
    opacity: 0.32;
    animation: drift2 26s ease-in-out infinite alternate;
  }
  .aurora .b3 {
    width: 420px; height: 420px; left: 55%; top: 45%;
    background: radial-gradient(circle at 50% 50%, #6d5cff, transparent 70%);
    opacity: 0.22;
    animation: drift3 30s ease-in-out infinite alternate;
  }
  @keyframes drift1 { from { transform: translate(0, 0) scale(1); } to { transform: translate(120px, 80px) scale(1.15); } }
  @keyframes drift2 { from { transform: translate(0, 0) scale(1.1); } to { transform: translate(-100px, -70px) scale(0.95); } }
  @keyframes drift3 { from { transform: translate(0, 0) scale(1); } to { transform: translate(-80px, 90px) scale(1.2); } }
  .grain {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.5;
    background-image: radial-gradient(rgba(255,255,255,0.055) 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 85%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 85%);
  }

  /* ---------- app shell ---------- */
  .app {
    width: 100%; max-width: 460px; height: min(860px, calc(100dvh - 40px));
    min-height: 560px;
    background: rgba(13, 19, 34, 0.78);
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 28px;
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.07);
    display: flex; flex-direction: column; overflow: hidden;
    position: relative; z-index: 2;
  }

  /* ---------- sign-in screen ---------- */
  .join {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 48px 36px; position: relative; overflow: hidden;
  }
  .join::before {
    content: ""; position: absolute; inset: -40%;
    background:
      radial-gradient(420px 420px at 50% 28%, rgba(14, 117, 182, 0.3), transparent 65%),
      radial-gradient(360px 360px at 50% 72%, rgba(0, 201, 167, 0.18), transparent 65%);
    pointer-events: none;
  }
  .join > * { position: relative; z-index: 1; }
  .logo-ring {
    width: 100px; height: 100px; border-radius: 32px;
    background: var(--grad);
    display: flex; align-items: center; justify-content: center;
    font-size: 48px; margin-bottom: 28px;
    box-shadow: 0 14px 40px rgba(14, 117, 182, 0.5), inset 0 1px 0 rgba(255,255,255,0.35);
    animation: float 3.2s ease-in-out infinite;
  }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  .join h2 { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 10px; }
  .join h2 .grad-text {
    background: linear-gradient(120deg, #4db2ff, #00e6b8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .join p { color: var(--muted); font-size: 14.5px; line-height: 1.6; margin-bottom: 32px; max-width: 300px; }
  .google-btn {
    display: flex; align-items: center; gap: 12px;
    background: #fff; color: #1f2430; border: none; border-radius: 16px;
    padding: 15px 30px; font-size: 16px; font-weight: 600; cursor: pointer;
    box-shadow: 0 12px 30px rgba(255, 255, 255, 0.14);
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s;
  }
  .google-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 16px 36px rgba(255, 255, 255, 0.2); }
  .google-btn:active:not(:disabled) { transform: translateY(0) scale(0.98); }
  .google-btn:disabled { opacity: 0.6; cursor: default; }
  .google-btn img { width: 20px; height: 20px; }
  .join .error { color: #ff7b8a; font-size: 13px; margin-top: 18px; max-width: 340px; min-height: 18px; }
  .join small { color: #5b6378; margin-top: 28px; font-size: 11.5px; letter-spacing: 2px; font-weight: 600; }

  /* ---------- chat screen ---------- */
  .chat { display: none; flex-direction: column; flex: 1; min-height: 0; }

  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 16px;
    background: rgba(11, 17, 32, 0.82);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--line);
    z-index: 5;
  }
  .avatar-wrap { position: relative; flex-shrink: 0; }
  .avatar-wrap img {
    width: 44px; height: 44px; border-radius: 50%; object-fit: cover; display: block;
    border: 2px solid transparent;
    background: var(--grad) border-box;
    box-shadow: 0 4px 14px rgba(0, 201, 167, 0.3);
  }
  .avatar-wrap::after {
    content: ""; position: absolute; right: -1px; bottom: -1px;
    width: 12px; height: 12px; border-radius: 50%;
    background: #22c55e; border: 2.5px solid var(--panel-2);
  }
  .me-block { flex: 1; min-width: 0; }
  .me-block .me {
    font-weight: 700; font-size: 15.5px; letter-spacing: -0.2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 600; color: #4ade80;
    background: rgba(34, 197, 94, 0.1);
    border: 1px solid rgba(34, 197, 94, 0.28);
    padding: 3px 10px; border-radius: 999px; margin-top: 4px;
  }
  .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.8); } }
  .status-pill.err { color: #ff7b8a; background: rgba(255, 80, 100, 0.1); border-color: rgba(255, 80, 100, 0.32); }
  .status-pill.err .dot { background: #ff7b8a; animation: none; }
  .status-pill.conn { color: #fbbf24; background: rgba(251, 191, 36, 0.1); border-color: rgba(251, 191, 36, 0.32); }
  .status-pill.conn .dot { background: #fbbf24; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 14px; border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.05); color: var(--muted);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background 0.15s, color 0.15s, transform 0.1s, border-color 0.15s;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: rgba(255, 123, 138, 0.12); color: #ff8f9c; border-color: rgba(255, 123, 138, 0.35); }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn svg { width: 17px; height: 17px; }

  /* ---------- messages ---------- */
  .messages {
    flex: 1; overflow-y: auto; overscroll-behavior: contain;
    padding: 18px 14px 10px;
    display: flex; flex-direction: column; gap: 10px;
    background:
      radial-gradient(600px 280px at 20% 0%, rgba(14, 117, 182, 0.08), transparent 60%),
      transparent;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.18) transparent;
  }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 999px; }
  .messages::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.26); }
  .date-chip {
    align-self: center; font-size: 11.5px; font-weight: 600; color: var(--muted);
    background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line);
    padding: 5px 14px; border-radius: 999px; margin: 2px 0 8px;
    letter-spacing: 0.4px; backdrop-filter: blur(6px);
  }
  .msg { display: flex; gap: 8px; max-width: 82%; animation: msgIn 0.28s cubic-bezier(0.21, 1.02, 0.73, 1); }
  @keyframes msgIn { from { opacity: 0; transform: translateY(12px) scale(0.97); } to { opacity: 1; transform: none; } }
  .msg.mine { align-self: flex-end; flex-direction: row-reverse; }
  .msg img.av {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; object-fit: cover;
    margin-top: 2px; background: var(--panel); border: 1px solid var(--line);
  }
  .msg .bubble {
    background: var(--bubble-in);
    border: 1px solid rgba(255, 255, 255, 0.07);
    padding: 10px 14px 8px;
    border-radius: 6px 18px 18px 18px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    min-width: 0;
  }
  .msg.mine .bubble {
    background: var(--bubble-mine);
    border: none;
    border-radius: 18px 6px 18px 18px;
    box-shadow: 0 6px 20px rgba(14, 117, 182, 0.38);
  }
  .msg .uname { font-size: 11.5px; color: var(--accent-2); font-weight: 700; margin-bottom: 3px; letter-spacing: 0.2px; }
  .msg.mine .uname { color: #d6f3ff; text-align: right; }
  .msg .txt { font-size: 15px; line-height: 1.5; word-break: break-word; }
  .msg .tm {
    font-size: 10.5px; color: rgba(139, 148, 171, 0.9); margin-top: 5px; text-align: right;
    display: flex; align-items: center; justify-content: flex-end; gap: 4px;
  }
  .msg.mine .tm { color: rgba(255, 255, 255, 0.75); }
  .msg.mine .tm::after { content: "✓✓"; font-size: 11px; color: #7dedff; letter-spacing: -2px; }

  /* ---------- typing indicator ---------- */
  .typing-indicator {
    display: none; align-items: center; gap: 8px;
    padding: 2px 18px 8px; font-size: 12.5px; color: var(--muted); font-style: italic;
  }
  .typing-indicator.show { display: flex; animation: msgIn 0.25s ease; }
  .typing-indicator .t-name { font-weight: 600; font-style: normal; color: var(--accent-2); }
  .typing-indicator .t-dots { display: inline-flex; gap: 3px; align-items: center; }
  .typing-indicator .t-dots span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
    animation: tblink 1.2s ease-in-out infinite;
  }
  .typing-indicator .t-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator .t-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes tblink { 0%, 60%, 100% { opacity: 0.25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

  /* ---------- composer ---------- */
  .send-row {
    display: flex; gap: 10px; align-items: center;
    padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
    background: rgba(11, 17, 32, 0.88);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
  }
  .input-wrap { position: relative; flex: 1; }
  .send-row input {
    width: 100%; padding: 14px 18px;
    border: 1px solid var(--line); border-radius: 999px;
    background: rgba(255, 255, 255, 0.05); color: var(--text);
    font-size: 15px; outline: none;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
  }
  .send-row input::placeholder { color: #5b6378; }
  .send-row input:focus {
    border-color: rgba(0, 201, 167, 0.65);
    background: rgba(255, 255, 255, 0.07);
    box-shadow: 0 0 0 4px rgba(0, 201, 167, 0.12);
  }
  .send-row input:disabled { opacity: 0.45; }
  .send-btn {
    width: 52px; height: 52px; border-radius: 50%; border: none;
    background: var(--grad); color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    box-shadow: 0 8px 24px rgba(14, 117, 182, 0.5), inset 0 1px 0 rgba(255,255,255,0.3);
    transition: transform 0.12s ease, box-shadow 0.15s ease, opacity 0.15s;
  }
  .send-btn:hover:not(:disabled) { transform: scale(1.07) rotate(-6deg); box-shadow: 0 10px 30px rgba(0, 201, 167, 0.55); }
  .send-btn:active:not(:disabled) { transform: scale(0.93); }
  .send-btn:disabled { opacity: 0.35; cursor: default; box-shadow: none; }
  .send-btn svg { width: 20px; height: 20px; margin-left: 2px; }

  /* ---------- responsive ---------- */
  @media (max-width: 520px) {
    body { padding: 0; }
    .app { max-width: none; height: 100dvh; min-height: 0; border-radius: 0; border: none; }
    .msg { max-width: 86%; }
    .aurora .blob { opacity: 0.35; }
  }
  @media (prefers-reduced-motion: reduce) {
    .msg, .typing-indicator.show { animation: none; }
    .logo-ring, .aurora .blob { animation: none; }
    .status-pill .dot, .typing-indicator .t-dots span { animation: none; }
  }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>
<div class="grain" aria-hidden="true"></div>

<div class="app">

  <!-- sign-in screen -->
  <div class="join" id="joinScreen">
    <div class="logo-ring">💬</div>
    <h2><span class="grad-text">Live Chat</span></h2>
    <p>Lightning-fast real-time messaging.<br>Sign in with Google to join the conversation.</p>
    <button class="google-btn" id="googleBtn" onclick="signInWithGoogle()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="G">
      Sign in with Google
    </button>
    <div class="error" id="authError"></div>
    <small>REAL-TIME · SECURE · POWERED BY FIREBASE</small>
  </div>

  <!-- chat screen -->
  <div class="chat" id="chatScreen">
    <div class="topbar">
      <div class="avatar-wrap"><img id="myAvatar" src="" alt=""></div>
      <div class="me-block">
        <div class="me" id="myName"></div>
        <span class="status-pill" id="connStatus"><span class="dot"></span><span id="connText">live</span></span>
      </div>
      <button class="icon-btn" onclick="signOut()" title="Sign out" aria-label="Sign out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="typing-indicator" id="typingIndicator"></div>
    <div class="send-row">
      <div class="input-wrap">
        <input type="text" id="msgInput" placeholder="Type a message..." maxlength="500" autocomplete="off" disabled>
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.5-7.5c.8-.35.8-1.45 0-1.8L3.4 3.6c-.66-.29-1.39.2-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .72.73 1.2 1.39.91z"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- Firebase SDK (compat for simple global usage) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  // Firebase config (public web config — safe in client code by design)
  var firebaseConfig = {
    apiKey: "AIzaSyCtCTVs9uJNouoCQb7dK1eYBwdJzxxjxZs",
    authDomain: "htc-website-d19cb.firebaseapp.com",
    projectId: "htc-website-d19cb",
    storageBucket: "htc-website-d19cb.firebasestorage.app",
    messagingSenderId: "810140004160",
    appId: "1:810140004160:web:657248939f35928a1ad4a5"
  };
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();

  var currentUser = null;
  var unsubscribe = null;
  var typingUnsub = null;
  var seenIds = {};
  var typingActive = false;
  var typingTimer = null;

  // status pill helpers (visual only — state still readable via connStatus)
  function setStatus(state) {
    var pill = document.getElementById('connStatus');
    var txt = document.getElementById('connText');
    pill.classList.remove('err', 'conn');
    if (state === 'error') { pill.classList.add('err'); txt.textContent = 'error'; }
    else if (state === 'connecting') { pill.classList.add('conn'); txt.textContent = 'connecting…'; }
    else { txt.textContent = 'live'; }
  }

  function showError(msg) {
    document.getElementById('authError').textContent = msg;
  }

  function signInWithGoogle() {
    showError("");
    document.getElementById('googleBtn').disabled = true;
    var provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(function(err) {
      document.getElementById('googleBtn').disabled = false;
      showError("Sign-in failed: " + (err.message || err.code));
    });
  }

  function signOut() {
    setTyping(false);
    clearTimeout(typingTimer);
    if (unsubscribe) { unsubscribe(); unsubscribe = null; }
    if (typingUnsub) { typingUnsub(); typingUnsub = null; }
    hideTyping();
    auth.signOut();
  }

  function addDateChip() {
    var box = document.getElementById('messages');
    var chip = document.createElement('div');
    chip.className = 'date-chip';
    chip.textContent = 'Today';
    box.appendChild(chip);
  }

  // React to auth state
  auth.onAuthStateChanged(function(user) {
    if (user) {
      currentUser = user;
      document.getElementById('joinScreen').style.display = 'none';
      document.getElementById('chatScreen').style.display = 'flex';
      document.getElementById('myName').textContent = user.displayName || user.email;
      document.getElementById('myAvatar').src = user.photoURL || '';
      document.getElementById('msgInput').disabled = false;
      document.getElementById('sendBtn').disabled = false;
      document.getElementById('messages').innerHTML = '';
      addDateChip();
      startListener();
      startTypingListener();
    } else {
      currentUser = null;
      typingActive = false;
      clearTimeout(typingTimer);
      if (unsubscribe) { unsubscribe(); unsubscribe = null; }
      if (typingUnsub) { typingUnsub(); typingUnsub = null; }
      seenIds = {};
      hideTyping();
      document.getElementById('messages').innerHTML = '';
      document.getElementById('chatScreen').style.display = 'none';
      document.getElementById('joinScreen').style.display = 'flex';
      document.getElementById('googleBtn').disabled = false;
    }
  });

  // Real-time listener — instant delivery, no polling
  function startListener() {
    if (unsubscribe) unsubscribe();
    setStatus('connecting');
    unsubscribe = db.collection("livechat_messages")
      .orderBy("createdAt", "asc")
      .limitToLast(100)
      .onSnapshot(function(snapshot) {
        setStatus('live');
        var box = document.getElementById('messages');
        snapshot.docChanges().forEach(function(change) {
          if (change.type !== "added") return;
          var id = change.doc.id;
          if (seenIds[id]) return;
          seenIds[id] = true;
          appendMessage(change.doc.data());
        });
        box.scrollTop = box.scrollHeight;
      }, function(err) {
        setStatus('error');
        console.error("Listener error:", err);
      });
  }

  // ---- Real typing indicator via Firestore ----
  function startTypingListener() {
    if (typingUnsub) typingUnsub();
    typingUnsub = db.collection("livechat_typing").onSnapshot(function(snap) {
      var names = [];
      var now = Date.now();
      snap.forEach(function(doc) {
        var d = doc.data();
        if (!d || d.typing !== true) return;
        if (currentUser && d.uid === currentUser.uid) return; // ignore self
        var ts = now;
        try { ts = d.updatedAt && d.updatedAt.toDate ? d.updatedAt.toDate().getTime() : now; } catch (e) { ts = now; }
        if (now - ts > 5000) return; // auto-expire stale entries
        if (d.name) names.push(String(d.name));
      });
      renderTyping(names);
    }, function(err) {
      console.error("Typing listener error:", err);
    });
  }

  function renderTyping(names) {
    var el = document.getElementById('typingIndicator');
    if (!names.length) { hideTyping(); return; }
    var label;
    if (names.length === 1) label = escapeHtml(names[0]) + ' is typing';
    else if (names.length === 2) label = escapeHtml(names[0]) + ' and ' + escapeHtml(names[1]) + ' are typing';
    else label = 'Several people are typing';
    el.innerHTML = '<span class="t-name">' + label + '</span><span class="t-dots"><span></span><span></span><span></span></span>';
    el.classList.add('show');
  }

  function hideTyping() {
    var el = document.getElementById('typingIndicator');
    el.classList.remove('show');
    el.innerHTML = '';
  }

  function setTyping(active) {
    if (!currentUser) return;
    typingActive = active;
    db.collection("livechat_typing").doc(currentUser.uid).set({
      uid: currentUser.uid,
      name: currentUser.displayName || currentUser.email || "Unknown",
      typing: active,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).catch(function(e) {
      console.error("Typing write failed:", e);
    });
  }

  function onComposerInput() {
    var has = document.getElementById('msgInput').value.trim().length > 0;
    if (has && !typingActive) setTyping(true);
    clearTimeout(typingTimer);
    if (has) {
      typingTimer = setTimeout(function() { setTyping(false); }, 2500);
    } else if (typingActive) {
      setTyping(false);
    }
  }

  function appendMessage(m) {
    var box = document.getElementById('messages');
    var div = document.createElement('div');
    var mine = currentUser && m.uid === currentUser.uid;
    div.className = 'msg' + (mine ? ' mine' : '');
    var av = m.photo ? '<img class="av" src="' + escapeAttr(m.photo) + '" alt="">' : '';
    var t = "";
    try {
      var d = m.createdAt && m.createdAt.toDate ? m.createdAt.toDate() : new Date();
      t = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    } catch (e) {}
    div.innerHTML = av + '<div class="bubble"><div class="uname">' + escapeHtml(m.name || "Unknown") +
      '</div><div class="txt">' + escapeHtml(m.text || "") + '</div><div class="tm">' + t + '</div></div>';
    box.appendChild(div);
    while (box.children.length > 100) box.removeChild(box.firstChild);
  }

  // Send on Enter
  document.getElementById('msgInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') sendMessage();
  });
  // Typing detection (debounced)
  document.getElementById('msgInput').addEventListener('input', onComposerInput);

  function sendMessage() {
    var input = document.getElementById('msgInput');
    var text = input.value.trim();
    if (!text || !currentUser) return;
    input.value = "";
    input.disabled = true;
    clearTimeout(typingTimer);
    setTyping(false);
    db.collection("livechat_messages").add({
      uid: currentUser.uid,
      name: currentUser.displayName || currentUser.email || "Unknown",
      photo: currentUser.photoURL || "",
      text: text.slice(0, 500),
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function() {
      input.disabled = false;
      input.focus();
    }).catch(function(err) {
      input.disabled = false;
      console.error("Send failed:", err);
      alert("Message failed to send. Please try again.");
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function escapeAttr(s) {
    return String(s).replace(/"/g, "&quot;");
  }
</script>
</body>
</html>
